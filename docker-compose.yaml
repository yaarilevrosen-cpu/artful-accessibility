services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: art_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - art_network

  backend:
    build:
      context: ./art-backend
      dockerfile: Dockerfile
    container_name: art_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/painting-system
      - NODE_ENV=production
    volumes:
      - ./art-backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - mosquitto
    networks:
      - art_network

  frontend:
    build:
      context: ./art-frontend
      dockerfile: Dockerfile
    container_name: art_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BASE_URL=http://192.168.68.133:3001
      - REACT_APP_SOCKET_URL=ws://192.168.68.133:3001
    depends_on:
      - backend
    networks:
      - art_network

  mongodb:
    image: mongo:latest
    container_name: art_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - art_network

networks:
  art_network:
    driver: bridge

volumes:
  mongodb_data:

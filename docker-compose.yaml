services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: art_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - art_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./art-backend
      dockerfile: Dockerfile
    container_name: art_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/painting-system
      - NODE_ENV=production
      # MQTT broker is reached over the Docker network by service name, not IP.
      - MQTT_BROKER_URL=mqtt://art_mosquitto
      # Inference server runs on the host (not in Docker), so it needs the host IP.
      - HOST_IP=${HOST_IP:-192.168.68.135}
      # sensor (default) = ESP32 distance sensor drives presence over MQTT.
      # camera = presenceService.js polls the inference server /status instead.
      - PRESENCE_SOURCE=${PRESENCE_SOURCE:-sensor}
      # Optional full override of the /status URL presenceService polls (e.g. for testing).
      - PRESENCE_STATUS_URL=${PRESENCE_STATUS_URL:-}
    volumes:
      - ./art-backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - mosquitto
    networks:
      - art_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./art-frontend
      dockerfile: Dockerfile
    container_name: art_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BASE_URL=
      - REACT_APP_SOCKET_URL=
      - REACT_APP_INFERENCE_URL=
    depends_on:
      - backend
    networks:
      - art_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:latest
    container_name: art_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - art_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  art_network:
    driver: bridge

volumes:
  mongodb_data:

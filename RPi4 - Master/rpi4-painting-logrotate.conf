# Log rotation configuration for RPi4 Painting System
# This file should be placed in /etc/logrotate.d/

/var/log/rpi4-painting.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 pi pi
    postrotate
        systemctl reload rpi4-painting > /dev/null 2>&1 || true
    endscript
}
